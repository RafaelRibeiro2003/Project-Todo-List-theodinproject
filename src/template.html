
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>
<body>
    <header class="header">
        <h1>Todo List</h1>
        <p>Organiza as tuas tarefas, um passo de cada vez.</p>
    </header>

    <main id="content">
        <section class="subContent" id="contentProj">
            <h2>Projects</h2>
            <div class="listProjects">

            </div>

            <button class="openBtn" id="addProject" type="button">
                + Add Project
            </button>
        </section>
        <section class="subContent" id="contentTask">
            <h2>Tasks</h2>
            <h3 id="selectedProjectName">Seleciona um projeto</h3>

            <div class="listTasks"></div>

            <button class="openBtn" id="addTask" type="button">
                + Add Task
            </button>
        </section>
    </main>
</body>
</html>
